[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vamp-arp-sentinel"
version = "2.0"
description = "ARP monitoring and rogue-device detection for authorized network audits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "arp", "network", "rogue-device", "intrusion-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
]


[project.scripts]
vamp-arp-sentinel = "vamp_arp_sentinel:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-arp-sentinel"
Repository = "https://github.com/Vampsecure-Labs/vamp-arp-sentinel"

[tool.setuptools]
py-modules = ["vamp_arp_sentinel", "vampsec_report"]
